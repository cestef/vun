# The notes of a release, from the conventional commits since the previous tag (`git cliff --latest`;
# `.github/workflows/release.yml` makes the body of the draft release from it). Only what a user of
# the toolchain sees is listed.
[changelog]
header = """
Install with `curl -fsSL https://raw.githubusercontent.com/cestef/vun/main/install.sh | sh`, or from an installed `vun` with `vun toolchain update`. Every archive is checked against the signed `SHA256SUMS` before it runs.
"""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
## {{ group | upper_first }}
{% for commit in commits -%}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | split(pat="\n") | first | upper_first }}
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
topo_order = false
sort_commits = "oldest"
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Fixes" },
    { message = "^perf", group = "Performance" },
    { message = ".*", skip = true },
]
