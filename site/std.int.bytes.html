<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>std.int.bytes</title><link rel="stylesheet" href="style.css"></head><body><nav><a href="index.html">Documentation</a><ul></ul></nav><main><h1><a href="std.html">std</a>.<a href="std.int.html">int</a>.<a href="std.int.bytes.html">bytes</a></h1><p>Integers as the bytes of their storage (spec 04, rule 7): <code>to_le</code> and <code>to_be</code> give the bytes of
