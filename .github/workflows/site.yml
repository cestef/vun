# The site (`site/`: the landing page, the guide with its course, and the playground), built and put on GitHub Pages when
# `main` changes what it is made of. A pull request builds it too, to catch a break before it
# lands, but deploys nothing.
#
# The slow part is the compiler the playground runs in the browser, built for WASI with fat LTO.
# It is kept by the hash of what it is built from: a change to the site alone (the pages, the
# lessons, the styles) reuses it and builds in about a minute, and a change to the compiler
# starts from the build cache of its dependencies.
#
# Once, in the repository's settings: Pages, Build and deployment, Source: GitHub Actions.
name: site

on:
  push:
    branches: [main]
    paths:
      - site/**
      - assets/**
      - corpus/accept/programs/**
      - editors/vscode/syntaxes/**
      - lib/**
      - compiler/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
      - .github/workflows/site.yml
  pull_request:
    paths:
      - site/**
      - assets/**
      - corpus/accept/programs/**
      - editors/vscode/syntaxes/**
      - lib/**
      - compiler/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read

# A deploy is let finish, so the site is never half replaced; a newer push waits behind it.
concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  COMPILER: target/wasm32-wasip1/dist/vun.wasm
  # Where the compiler is kept: outside `target/`, which the Rust cache prunes.
  KEPT: .site-cache/vun.wasm

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4

      # The compiler, by what it is built from. `lib/` and the corpus are read by the site, not
      # built into the compiler, so they are not in the key.
      - id: compiler
        uses: actions/cache@v4
        with:
          path: ${{ env.KEPT }}
          key: compiler-${{ hashFiles('compiler/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**') }}

      - if: steps.compiler.outputs.cache-hit != 'true'
        run: rustup toolchain install --profile minimal
      - if: steps.compiler.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-wasip1
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: steps.compiler.outputs.cache-hit != 'true'
        run: |
          cargo build --package vun-cli --target wasm32-wasip1 --profile dist
          install -D "$COMPILER" "$KEPT"
      - run: install -D "$KEPT" "$COMPILER"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install the site's packages
        working-directory: site
        run: pnpm install --frozen-lockfile

      # The guide's programs and lessons through the compiler just built, so that a language that
      # moved under one fails here and not on the page.
      - name: Check the guide and the lessons
        working-directory: site
        run: pnpm test

      # Where the pages are served from: `/vun/` for a project's, nothing for a custom domain's.
      # A pull request, whose token may not read the settings, is built to be served from `/`.
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Build the site
        working-directory: site
        env:
          VUN_SITE_BASE: ${{ steps.pages.outputs.base_path }}/
        run: pnpm build

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
