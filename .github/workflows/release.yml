# A release of the toolchain (spec 12, section 6), made when a version is tagged (`0.4.2`, the
# workspace's version as it is): the checks run, each machine's toolchain is built and packed by
# `cargo xtask package` (with the libraries of its components, each an archive), `cargo xtask release` writes the manifest `vun toolchain install` reads,
# and everything goes to a draft release, published by hand. The checks and the builds run side by
# side; the draft is made only when both pass. Its notes are `cliff.toml`'s, from the commits since
# the previous tag.
name: release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang lld gcc-arm-none-eabi libnewlib-arm-none-eabi
      - run: cargo xtask check
      - run: cargo clippy --all-targets
      - run: cargo nextest run

  package:
    strategy:
      matrix:
        include:
          # Linux against glibc 2.28, as old as distributions still in use run, through zig's
          # linker; dynamically linked, so `vun ffi bind` can load libclang.
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            build: zigbuild
            glibc: ".2.28"
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            build: zigbuild
            glibc: ".2.28"
          - runner: macos-15
            target: aarch64-apple-darwin
            build: build
            glibc: ""
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: matrix.build == 'zigbuild'
        uses: mlugg/setup-zig@v2
      - if: matrix.build == 'zigbuild'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - run: rustup target add ${{ matrix.target }} && rustup component add llvm-tools
      # The profile `vun` is optimized by (decision 670): a `vun` recording what runs, run over the
      # workloads of `vun debug profile` on this machine, whose architecture the release is for.
      - run: cargo xtask pgo
      # `vun` links only what the `dist` feature names; its backends and linkers are components, the
      # libraries of `cargo xtask components`, which `package` packs beside the toolchain.
      - run: cargo ${{ matrix.build }} --profile dist --package vun-cli --no-default-features --features dist --target ${{ matrix.target }}${{ matrix.glibc }}
        env:
          RUSTFLAGS: -D warnings -Cprofile-use=${{ github.workspace }}/target/pgo/vun.profdata -Cllvm-args=-no-pgo-warn-mismatch
      - run: cargo xtask components --tool ${{ matrix.build }} --target ${{ matrix.target }}${{ matrix.glibc }}
      - run: cargo xtask package target/${{ matrix.target }}/dist/vun dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/vun-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    needs: [check, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cargo xtask release dist --tag "$GITHUB_REF_NAME"
      # The raw Ed25519 signatures of the manifest, which `vun` checks against the key it is built
      # with (`compiler/pkg/build/src/release/key.pub`), and of the archives' checksums, which
      # `install.sh` checks against the same key before it runs anything.
      - name: Sign the manifest and the checksums
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
        run: |
          test -n "$RELEASE_KEY" || { echo "the RELEASE_KEY secret is not set" >&2; exit 1; }
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_KEY" > "$key"
          (cd dist && sha256sum vun-*.tar.gz > SHA256SUMS)
          for file in release.json SHA256SUMS; do
            openssl pkeyutl -sign -rawin -inkey "$key" -in "dist/$file" -out "dist/$file.sig"
          done
      - run: git cliff --latest --output notes.md
      - run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md dist/*.tar.gz dist/release.json dist/release.json.sig dist/SHA256SUMS dist/SHA256SUMS.sig
        env:
          GH_TOKEN: ${{ github.token }}
