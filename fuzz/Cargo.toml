[package]
name = "vun-fuzz"
description = "Fuzz targets, run with cargo-fuzz: `cargo fuzz run <target>`."
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
vun-diag = { path = "../compiler/base/diag" }
vun-origin = { path = "../compiler/base/origin" }
vun-span = { path = "../compiler/base/span" }
vun-syntax = { path = "../compiler/front/syntax" }

[[bin]]
name = "lex"
path = "fuzz_targets/lex.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false
