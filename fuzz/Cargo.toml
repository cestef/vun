[package]
name = "vun-fuzz"
description = "Fuzz targets, run with cargo-fuzz: `cargo fuzz run <target>`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata]
cargo-fuzz = true

[lints]
workspace = true

[dependencies]
libfuzzer-sys.workspace = true
vun-diag.workspace = true
vun-origin.workspace = true
vun-span.workspace = true
vun-syntax.workspace = true

[[bin]]
name = "lex"
path = "fuzz_targets/lex.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false
