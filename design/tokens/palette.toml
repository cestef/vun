# Color ramps. The only file where a color value is written: themes, parts and every
# generated output name a color as `ramp.step`. Pastel at the light end, usable ink at the dark.
#
# peach   the crab; the brand color
# sea     seafoam, the shell; secondary accent, notes
# sky     pale blue; links and help in some directions
# butter  warm yellow; warnings, highlights
# rose    pink; errors, cheeks
# stone   warm neutrals for surfaces and text

