# Mascot variants for the gallery. Ids are the group id and the item's position.
# An item swaps slots of `base` (default mascot/poses/default); `""` drops a slot.
# `look` names a colorway under colorways/ (default quartz).

[[group]]
id = "L"
title = "Legs"
note = "The new base (big body, wavy stalks, cat mouth, claws up) with every leg option."

[[group.item]]
label = "Sticks (current)"

[[group.item]]
label = "No legs"
swap = { legs = "" }

[[group.item]]
label = "Spikes"
note = "Tapered cones, like Dwebble's feet."
swap = { legs = "explore/mascot/parts/legs/spikes" }

[[group.item]]
label = "One pair"
swap = { legs = "explore/mascot/parts/legs/pair" }

[[group.item]]
label = "Nubs"
note = "Round feet under the body."
swap = { legs = "explore/mascot/parts/legs/nubs" }

[[group.item]]
label = "Stubs"
swap = { legs = "explore/mascot/parts/legs/stubs" }

[[group.item]]
label = "Arched"
note = "Ferris-like, bent out and pointed."
swap = { legs = "explore/mascot/parts/legs/arched" }

[[group.item]]
label = "Tucked"
note = "Folded away; only tips beside the body."
swap = { legs = "explore/mascot/parts/legs/tucked" }

[[group.item]]
label = "Spikes, claws at rest"
swap = { legs = "explore/mascot/parts/legs/spikes", claws = "mascot/parts/claws/rest" }

[[group.item]]
label = "Nubs, claws at rest"
swap = { legs = "explore/mascot/parts/legs/nubs", claws = "mascot/parts/claws/rest" }

[[group.item]]
label = "No legs, claws at rest"
swap = { legs = "", claws = "mascot/parts/claws/rest" }

[[group.item]]
label = "Tucked, small body"
swap = { legs = "explore/mascot/parts/legs/tucked", body = "mascot/parts/body/base" }

