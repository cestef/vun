[[group.item]]
label = "Terminal, happy, pincher"
swap = { shell = "explore/mascot/parts/shell/terminal", eyes = "mascot/parts/eyes/happy", claws = "mascot/parts/claws/raised", mouth = "explore/mascot/parts/mouth/grin" }
