<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <style id="theme">
    .f-shell-top { fill: #F0FAF7 }
    .s-shell-top { stroke: #F0FAF7 }
    .f-shell-hi { fill: #DDF3EC }
    .s-shell-hi { stroke: #DDF3EC }
    .f-shell { fill: #C0E8DC }
    .s-shell { stroke: #C0E8DC }
    .f-shell-lo { fill: #9ADAC8 }
    .s-shell-lo { stroke: #9ADAC8 }
    .f-shell-deep { fill: #72C5AF }
    .s-shell-deep { stroke: #72C5AF }
    .f-hollow { fill: #15302B }
    .s-hollow { stroke: #15302B }
    .f-fleck { fill: #FBD878 }
    .s-fleck { stroke: #FBD878 }
    .f-body { fill: #FBB49E }
    .s-body { stroke: #FBB49E }
    .f-body-lo { fill: #E57B5E }
    .s-body-lo { stroke: #E57B5E }
    .f-ink { fill: #24211D }
    .s-ink { stroke: #24211D }
    .f-glint { fill: #F9F7F4 }
    .s-glint { stroke: #F9F7F4 }
    .f-mouth { fill: #A04A3A }
    .s-mouth { stroke: #A04A3A }
    .f-cheek { fill: #F9A5BC }
    .s-cheek { stroke: #F9A5BC }
    .f-word { fill: #24211D }
    .s-word { stroke: #24211D }
    .f-word-accent { fill: #F4987D }
    .s-word-accent { stroke: #F4987D }
  </style>
  <!-- A hex nut seen from the side: three faces, chamfered rims. -->
  <polygon class="f-shell" points="100,110 180,90 180,340 100,320" />
  <polygon class="f-shell-hi" points="180,90 332,90 332,340 180,340" />
  <polygon class="f-shell-lo" points="332,90 412,110 412,320 332,340" />
  <polygon class="f-shell-top" points="100,110 180,90 332,90 412,110 412,128 332,110 180,110 100,128" />
  <polygon class="f-shell-deep" points="100,302 180,320 332,320 412,302 412,320 332,340 180,340 100,320" />
  <ellipse class="f-hollow" cx="256" cy="316" rx="96" ry="30" />
</svg>
