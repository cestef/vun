<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <style id="theme">
    .f-shell-top { fill: #D9C8C7 }
    .s-shell-top { stroke: #D9C8C7 }
    .f-shell-hi { fill: #D0BEBD }
    .s-shell-hi { stroke: #D0BEBD }
    .f-shell { fill: #BFADAC }
    .s-shell { stroke: #BFADAC }
    .f-shell-lo { fill: #A99695 }
    .s-shell-lo { stroke: #A99695 }
    .f-shell-deep { fill: #8A7C7B }
    .s-shell-deep { stroke: #8A7C7B }
    .f-hollow { fill: #24211D }
    .s-hollow { stroke: #24211D }
    .f-fleck { fill: #E57B5E }
    .s-fleck { stroke: #E57B5E }
    .f-body { fill: #DF7999 }
    .s-body { stroke: #DF7999 }
    .f-body-lo { fill: #B75777 }
    .s-body-lo { stroke: #B75777 }
    .f-ink { fill: #24211D }
    .s-ink { stroke: #24211D }
    .f-glint { fill: #D9C8C7 }
    .s-glint { stroke: #D9C8C7 }
    .f-mouth { fill: #6B4956 }
    .s-mouth { stroke: #6B4956 }
    .f-cheek { fill: #E89BB1 }
    .s-cheek { stroke: #E89BB1 }
    .f-word { fill: #24211D }
    .s-word { stroke: #24211D }
    .f-word-accent { fill: #D46287 }
    .s-word-accent { stroke: #D46287 }
  </style>
  <!-- A terminal for a shell: the prompt blinks in the fleck color. -->
  <rect class="f-shell-lo" x="100" y="58" width="320" height="276" rx="40" />
  <rect class="f-shell" x="100" y="50" width="312" height="268" rx="38" />
  <rect class="f-hollow" x="136" y="80" width="240" height="72" rx="14" />
  <g class="s-fleck" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M160,100 L178,116 L160,132" />
    <path d="M194,132 H222" />
  </g>
  <ellipse class="f-hollow" cx="256" cy="314" rx="100" ry="32" />
</svg>
