<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <style id="theme">
    .f-shell-top { fill: #F0FAF7 }
    .s-shell-top { stroke: #F0FAF7 }
    .f-shell-hi { fill: #DDF3EC }
    .s-shell-hi { stroke: #DDF3EC }
    .f-shell { fill: #C0E8DC }
    .s-shell { stroke: #C0E8DC }
    .f-shell-lo { fill: #9ADAC8 }
    .s-shell-lo { stroke: #9ADAC8 }
    .f-shell-deep { fill: #72C5AF }
    .s-shell-deep { stroke: #72C5AF }
    .f-hollow { fill: #15302B }
    .s-hollow { stroke: #15302B }
    .f-fleck { fill: #FBD878 }
    .s-fleck { stroke: #FBD878 }
    .f-body { fill: #FBB49E }
    .s-body { stroke: #FBB49E }
    .f-body-lo { fill: #E57B5E }
    .s-body-lo { stroke: #E57B5E }
    .f-ink { fill: #24211D }
    .s-ink { stroke: #24211D }
    .f-glint { fill: #F9F7F4 }
    .s-glint { stroke: #F9F7F4 }
    .f-mouth { fill: #A04A3A }
    .s-mouth { stroke: #A04A3A }
    .f-cheek { fill: #F9A5BC }
    .s-cheek { stroke: #F9A5BC }
    .f-word { fill: #24211D }
    .s-word { stroke: #24211D }
    .f-word-accent { fill: #F4987D }
    .s-word-accent { stroke: #F4987D }
  </style>
  <!-- A terminal for a shell: the prompt blinks in the fleck color. -->
  <rect class="f-shell-lo" x="100" y="58" width="320" height="276" rx="40" />
  <rect class="f-shell" x="100" y="50" width="312" height="268" rx="38" />
  <rect class="f-hollow" x="136" y="80" width="240" height="72" rx="14" />
  <g class="s-fleck" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M160,100 L178,116 L160,132" />
    <path d="M194,132 H222" />
  </g>
  <ellipse class="f-hollow" cx="256" cy="314" rx="100" ry="32" />
</svg>
