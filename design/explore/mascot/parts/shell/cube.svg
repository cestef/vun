<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <style id="theme">
    .f-shell-top { fill: #F0FAF7 }
    .s-shell-top { stroke: #F0FAF7 }
    .f-shell-hi { fill: #DDF3EC }
    .s-shell-hi { stroke: #DDF3EC }
    .f-shell { fill: #C0E8DC }
    .s-shell { stroke: #C0E8DC }
    .f-shell-lo { fill: #9ADAC8 }
    .s-shell-lo { stroke: #9ADAC8 }
    .f-shell-deep { fill: #72C5AF }
    .s-shell-deep { stroke: #72C5AF }
    .f-hollow { fill: #15302B }
