  <polygon class="f-shell-lo" points="256,218 412,138 412,286 256,366" />
  <polygon class="f-fleck" points="164,105 192,91 348,171 320,185" />
  <polygon class="f-fleck" points="320,185 348,171 348,219 320,233" />
  <ellipse class="f-hollow" cx="256" cy="320" rx="96" ry="30" />
