<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <style id="theme">
    .f-shell-top { fill: #D9C8C7 }
    .s-shell-top { stroke: #D9C8C7 }
    .f-shell-hi { fill: #D0BEBD }
    .s-shell-hi { stroke: #D0BEBD }
    .f-shell { fill: #BFADAC }
    .s-shell { stroke: #BFADAC }
    .f-shell-lo { fill: #A99695 }
    .s-shell-lo { stroke: #A99695 }
    .f-shell-deep { fill: #8A7C7B }
    .s-shell-deep { stroke: #8A7C7B }
    .f-hollow { fill: #24211D }
    .s-hollow { stroke: #24211D }
    .f-fleck { fill: #E57B5E }
    .s-fleck { stroke: #E57B5E }
    .f-body { fill: #DF7999 }
    .s-body { stroke: #DF7999 }
    .f-body-lo { fill: #B75777 }
    .s-body-lo { stroke: #B75777 }
    .f-ink { fill: #24211D }
    .s-ink { stroke: #24211D }
    .f-glint { fill: #D9C8C7 }
    .s-glint { stroke: #D9C8C7 }
    .f-mouth { fill: #6B4956 }
    .s-mouth { stroke: #6B4956 }
    .f-cheek { fill: #E89BB1 }
    .s-cheek { stroke: #E89BB1 }
    .f-word { fill: #24211D }
    .s-word { stroke: #24211D }
    .f-word-accent { fill: #D46287 }
    .s-word-accent { stroke: #D46287 }
  </style>
  <!-- A gem: every facet meets the ridge point at 270,170. -->
  <polygon class="f-shell-top" points="250,30 150,110 270,170" />
  <polygon class="f-shell-hi" points="250,30 360,70 270,170" />
  <polygon class="f-shell" points="150,110 110,260 270,170" />
  <polygon class="f-shell-lo" points="360,70 420,200 270,170" />
  <polygon class="f-shell-deep" points="420,200 380,320 270,170" />
  <polygon class="f-shell" points="110,260 150,330 256,350 270,170" />
  <polygon class="f-shell-lo" points="256,350 380,320 270,170" />
  <ellipse class="f-hollow" cx="256" cy="316" rx="100" ry="32" />
</svg>
