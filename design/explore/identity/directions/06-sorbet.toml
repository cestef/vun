title = "Sorbet"
note = "Rose and butter, round type. Playful like the Go gopher."
[type]
display = { family = "Baloo 2", fallback = ["system-ui", "sans-serif"], weights = [800] }
text = { family = "Nunito", fallback = ["system-ui", "sans-serif"], weights = [400, 700] }
mono = { family = "Recursive", fallback = ["monospace"], weights = [400] }
[mascot]
swap = { shell = "explore/mascot/parts/shell/pebble", eyes = "explore/mascot/parts/eyes/big", claws = "explore/mascot/parts/claws/wave" }
[art]
shell-top = "butter.50"
shell-hi = "butter.100"
shell = "butter.200"
shell-lo = "butter.300"
shell-deep = "butter.400"
hollow = "butter.900"
body = "rose.300"
body-lo = "rose.500"
word-accent = "rose.400"
[ui]
bg = "butter.50"
surface = "stone.50"
border = "butter.200"
text = "rose.900"
muted = "rose.700"
accent = "rose.500"
link = "sky.600"
code-bg = "stone.50"
[code]
keyword = "rose.600"
string = "sky.600"
literal = "butter.700"
