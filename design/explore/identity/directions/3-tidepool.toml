title = "Tidepool"
note = "Seafoam leads, peach follows. A soft serif display for a friendlier, bookish voice."
[type]
display = { family = "Fraunces", fallback = ["Georgia", "serif"], weights = [700] }
text = { family = "Instrument Sans", fallback = ["system-ui", "sans-serif"], weights = [400, 600] }
mono = { family = "JetBrains Mono", fallback = ["monospace"], weights = [400] }
[mascot]
swap = { shell = "explore/mascot/parts/shell/whelk" }
[ui]
bg = "sea.50"
surface = "sea.100"
border = "sea.200"
text = "sea.900"
muted = "sea.700"
accent = "sea.600"
link = "peach.600"
code-bg = "stone.50"
[code]
keyword = "sea.700"
string = "peach.700"
