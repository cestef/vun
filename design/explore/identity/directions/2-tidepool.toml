title = "Tidepool"
note = "Teal primary on warm sand, coral accents. A soft serif display for a friendlier, bookish voice."
[type]
display = { family = "Fraunces", fallback = ["Georgia", "serif"], weights = [700] }
text = { family = "Instrument Sans", fallback = ["system-ui", "sans-serif"], weights = [400, 600] }
mono = { family = "JetBrains Mono", fallback = ["monospace"], weights = [400] }
[mascot]
swap = { shell = "explore/mascot/parts/shell/whelk" }
[ramps.sand]
50 = "#FBF7EF"
100 = "#F3EADA"
200 = "#E6D7BC"
600 = "#7C6A4E"
900 = "#2B241A"
[art]
shell-top = "sand.50"
shell-hi = "sand.100"
shell = "sand.200"
shell-lo = "stone.300"
shell-deep = "stone.400"
body = "coral.500"
body-lo = "coral.700"
ink = "tide.900"
cheek = "sun.300"
[ui]
bg = "sand.50"
surface = "sand.100"
border = "sand.200"
text = "sand.900"
muted = "sand.600"
accent = "tide.500"
link = "tide.700"
code-bg = "sand.100"
[code]
keyword = "tide.700"
string = "coral.700"
literal = "violet.600"
