<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200">
  <style id="theme">
    .f-shell-top { fill: #F0FAF7 }
    .s-shell-top { stroke: #F0FAF7 }
    .f-shell-hi { fill: #DDF3EC }
    .s-shell-hi { stroke: #DDF3EC }
    .f-shell { fill: #C0E8DC }
    .s-shell { stroke: #C0E8DC }
    .f-shell-lo { fill: #9ADAC8 }
    .s-shell-lo { stroke: #9ADAC8 }
    .f-shell-deep { fill: #72C5AF }
    .s-shell-deep { stroke: #72C5AF }
    .f-hollow { fill: #15302B }
    .s-hollow { stroke: #15302B }
    .f-fleck { fill: #FBD878 }
    .s-fleck { stroke: #FBD878 }
    .f-body { fill: #FBB49E }
    .s-body { stroke: #FBB49E }
    .f-body-lo { fill: #E57B5E }
    .s-body-lo { stroke: #E57B5E }
    .f-ink { fill: #24211D }
    .s-ink { stroke: #24211D }
    .f-glint { fill: #F9F7F4 }
    .s-glint { stroke: #F9F7F4 }
    .f-mouth { fill: #A04A3A }
    .s-mouth { stroke: #A04A3A }
    .f-cheek { fill: #F9A5BC }
    .s-cheek { stroke: #F9A5BC }
    .f-word { fill: #24211D }
    .s-word { stroke: #24211D }
    .f-word-accent { fill: #F4987D }
    .s-word-accent { stroke: #F4987D }
  </style>
  <!-- v runs into u; u and n share a stem. -->
  <g fill="none" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <path class="s-word-accent" d="M40,40 L90,160 L140,40" />
    <path class="s-word" d="M140,40 V110 A50,50 0 0 0 240,110 V40 M240,40 V160 M240,90 A50,50 0 0 1 340,90 V160" />
  </g>
</svg>
