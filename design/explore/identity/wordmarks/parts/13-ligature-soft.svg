  <!-- A curved v runs into u; u and n share a stem. -->
  <g fill="none" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <path class="s-word-accent" d="M40,40 C58,112 72,160 90,160 C108,160 122,112 140,40" />
    <path class="s-word" d="M140,40 V110 A50,50 0 0 0 240,110 V40 M240,40 V160 M240,90 A50,50 0 0 1 340,90 V160" />
  </g>
