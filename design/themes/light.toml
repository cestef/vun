# Roles for light backgrounds. Every value names a `ramp.step` of tokens/palette.toml.
#
# [art]   paints of the figures: a part's `f-<role>` fills, `s-<role>` strokes
# [ui]    surfaces and text for sites, docs and tools
# [diag]  diagnostic severities, shared by every renderer that shows color
# [code]  syntax colors for code samples and editor themes

[art]
shell-top = "sea.50"
shell-hi = "sea.100"
shell = "sea.200"
shell-lo = "sea.300"
shell-deep = "sea.400"
hollow = "sea.900"
fleck = "butter.300"
body = "peach.300"
body-lo = "peach.500"
ink = "stone.900"
glint = "stone.50"
mouth = "peach.700"
cheek = "rose.300"
word = "stone.900"
word-accent = "peach.400"

[ui]
bg = "stone.50"
surface = "stone.100"
border = "stone.200"
text = "stone.900"
muted = "stone.600"
accent = "peach.500"
link = "sea.700"
code-bg = "stone.100"

[diag]
error = "rose.600"
warning = "butter.700"
note = "sea.700"
help = "sky.600"

[code]
text = "stone.900"
comment = "stone.500"
keyword = "peach.600"
name = "stone.900"
string = "sea.700"
literal = "sky.600"
punct = "stone.600"
