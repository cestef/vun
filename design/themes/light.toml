# Roles for light backgrounds. Every value names a `ramp.step` of tokens/palette.toml.
#
# [art]   paints of the figures: a part's `f-<role>` fills, `s-<role>` strokes
# [ui]    surfaces and text for sites, docs and tools
# [diag]  diagnostic severities, shared by every renderer that shows color
# [code]  syntax colors for code samples and editor themes

[art]
shell-top = "quartz.100"
shell-hi = "quartz.200"
shell = "quartz.300"
shell-lo = "quartz.400"
shell-deep = "quartz.500"
hollow = "stone.900"
fleck = "peach.500"
body = "blush.400"
body-lo = "blush.600"
ink = "stone.900"
glint = "quartz.100"
mouth = "blush.800"
cheek = "blush.300"
word = "stone.900"
word-accent = "blush.500"

[ui]
bg = "stone.50"
surface = "stone.100"
border = "stone.200"
text = "stone.900"
muted = "stone.600"
accent = "blush.600"
link = "sea.700"
code-bg = "stone.100"

[diag]
error = "rose.600"
warning = "butter.700"
note = "sea.700"
help = "sky.600"

[code]
text = "stone.900"
comment = "stone.500"
keyword = "blush.600"
name = "stone.900"
string = "sea.700"
literal = "sky.600"
punct = "stone.600"
