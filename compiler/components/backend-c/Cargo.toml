[package]
name = "vun-component-backend-c"
description = "The c backend as a component of the toolchain."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[package.metadata.vun-component]
# The smallest profile of a release that holds it.
profile = "minimal"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Defines the library's entry symbol: set to build the library, never to link the crate in.
export = []

[dependencies]
vun-component.workspace = true
vun-backend-component.workspace = true
vun-backend-c = { workspace = true }
vun-backend.workspace = true
