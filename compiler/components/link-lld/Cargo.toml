[package]
name = "vun-component-link-lld"
description = "The lld linker as a component of the toolchain."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[package.metadata.vun-component]
# The smallest profile of a release that holds it.
profile = "default"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Defines the library's entry symbol: set to build the library, never to link the crate in.
export = []

[dependencies]
vun-component.workspace = true
vun-link-component.workspace = true
vun-link.workspace = true
vun-link-lld = { workspace = true }
