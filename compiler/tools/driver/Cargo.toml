[package]
name = "vun-driver"
description = "The compiler as a library: sessions, registries, commands."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["backend-c", "backend-native", "backend-wasm", "backend-cranelift", "backend-qbe", "backend-llvm", "backend-external", "link-wild", "link-mold", "link-ar", "link-lld", "link-wasm", "link-gnu", "link-msvc", "link-external"]
backend-c = ["dep:vun-backend-c"]
backend-native = ["dep:vun-backend-native"]
backend-wasm = ["dep:vun-backend-wasm"]
backend-cranelift = ["dep:vun-backend-cranelift"]
backend-qbe = ["dep:vun-backend-qbe"]
backend-llvm = ["dep:vun-backend-llvm"]
backend-external = ["dep:vun-backend-external"]
link-wild = ["dep:vun-link-wild"]
link-mold = ["dep:vun-link-mold"]
link-ar = ["dep:vun-link-ar"]
link-lld = ["dep:vun-link-lld"]
link-wasm = ["dep:vun-link-wasm"]
link-gnu = ["dep:vun-link-gnu"]
link-msvc = ["dep:vun-link-msvc"]
link-external = ["dep:vun-link-external"]

[dependencies]
vun-sema-plan.workspace = true
vun-sema-ty.workspace = true
vun-fetch.workspace = true
vun-uri.workspace = true
vun-data.workspace = true
vun-fs.workspace = true
vun-par.workspace = true
vun-suggest.workspace = true
vun-hash.workspace = true
vun-command.workspace = true
vun-term.workspace = true
vun-trace.workspace = true
vun-span.workspace = true
vun-origin.workspace = true
vun-diag.workspace = true
vun-doc.workspace = true
vun-query.workspace = true
vun-reduce.workspace = true
vun-target.workspace = true
vun-sanitize.workspace = true
vun-tool.workspace = true
vun-syntax.workspace = true
vun-fmt.workspace = true
vun-index.workspace = true
vun-variants.workspace = true
vun-grammar.workspace = true
vun-hir.workspace = true
vun-intern.workspace = true
vun-sema.workspace = true
vun-items.workspace = true
vun-mir.workspace = true
vun-mir-passes.workspace = true
vun-interp.workspace = true
vun-lir.workspace = true
vun-lower.workspace = true
vun-lir-passes.workspace = true
vun-backend.workspace = true
vun-link.workspace = true
vun-build.workspace = true
vun-render-short.workspace = true
vun-render-annotate.workspace = true
vun-render-ariadne.workspace = true
vun-backend-c = { workspace = true, optional = true }
vun-backend-native = { workspace = true, optional = true }
vun-backend-wasm = { workspace = true, optional = true }
vun-backend-cranelift = { workspace = true, optional = true }
vun-backend-qbe = { workspace = true, optional = true }
vun-backend-llvm = { workspace = true, optional = true }
vun-backend-external = { workspace = true, optional = true }
vun-link-wild = { workspace = true, optional = true }
vun-link-mold = { workspace = true, optional = true }
vun-link-ar = { workspace = true, optional = true }
vun-link-lld = { workspace = true, optional = true }
vun-link-wasm = { workspace = true, optional = true }
vun-link-gnu = { workspace = true, optional = true }
vun-link-msvc = { workspace = true, optional = true }
vun-link-external = { workspace = true, optional = true }

[dev-dependencies]
# The generated assemblers, whose numbering sema's tables must follow.
vun-isa-arm64.workspace = true
vun-isa-thumb.workspace = true
vun-isa-x86_64.workspace = true
# What a block's instructions need of a processor.
vun-inline.workspace = true
vun-harness.workspace = true
vun-bind.workspace = true
vun-hash.workspace = true
criterion.workspace = true
# An independent validator of the programs the wasm linker links.
wasmparser.workspace = true
# Reads back the libraries and programs linked for Windows.
vun-pe.workspace = true
vun-wasm.workspace = true

[[bench]]
name = "compile"
harness = false
