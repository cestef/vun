[package]
name = "vun-driver"
description = "The compiler as a library: sessions, registries, commands."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["backend-c", "backend-baseline", "backend-cranelift", "backend-qbe", "backend-llvm", "backend-process", "link-wild", "link-mold", "link-lld", "link-gnu", "link-msvc", "link-process"]
backend-c = ["dep:vun-backend-c"]
backend-baseline = ["dep:vun-backend-baseline"]
backend-cranelift = ["dep:vun-backend-cranelift"]
backend-qbe = ["dep:vun-backend-qbe"]
backend-llvm = ["dep:vun-backend-llvm"]
backend-process = ["dep:vun-backend-process"]
link-wild = ["dep:vun-link-wild"]
link-mold = ["dep:vun-link-mold"]
link-lld = ["dep:vun-link-lld"]
link-gnu = ["dep:vun-link-gnu"]
link-msvc = ["dep:vun-link-msvc"]
link-process = ["dep:vun-link-process"]

[dependencies]
vun-pkg.workspace = true
vun-bind.workspace = true
vun-clang.workspace = true
vun-fs.workspace = true
vun-par.workspace = true
vun-suggest.workspace = true
vun-hash.workspace = true
vun-command.workspace = true
vun-trace.workspace = true
vun-span.workspace = true
vun-origin.workspace = true
vun-diag.workspace = true
vun-query.workspace = true
vun-target.workspace = true
vun-tool.workspace = true
vun-syntax.workspace = true
vun-grammar.workspace = true
vun-hir.workspace = true
vun-intern.workspace = true
vun-index.workspace = true
vun-sema.workspace = true
vun-items.workspace = true
vun-mir.workspace = true
vun-mir-passes.workspace = true
vun-interp.workspace = true
vun-lir.workspace = true
vun-lower.workspace = true
vun-lir-passes.workspace = true
vun-backend.workspace = true
vun-link.workspace = true
vun-build.workspace = true
vun-render-short.workspace = true
vun-render-annotate.workspace = true
vun-render-ariadne.workspace = true
vun-backend-c = { workspace = true, optional = true }
vun-backend-baseline = { workspace = true, optional = true }
vun-backend-cranelift = { workspace = true, optional = true }
vun-backend-qbe = { workspace = true, optional = true }
vun-backend-llvm = { workspace = true, optional = true }
vun-backend-process = { workspace = true, optional = true }
vun-link-wild = { workspace = true, optional = true }
vun-link-mold = { workspace = true, optional = true }
vun-link-lld = { workspace = true, optional = true }
vun-link-gnu = { workspace = true, optional = true }
vun-link-msvc = { workspace = true, optional = true }
vun-link-process = { workspace = true, optional = true }

[dev-dependencies]
vun-harness.workspace = true
vun-hash.workspace = true
