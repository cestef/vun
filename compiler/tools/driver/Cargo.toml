[package]
name = "vun-driver"
description = "The compiler as a library: sessions, registries, commands."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["backend-c", "backend-native", "native-x86_64", "native-arm64", "native-thumb", "backend-wasm", "backend-cranelift", "cranelift-x86_64", "cranelift-arm64", "backend-qbe", "backend-llvm", "backend-external", "link-wild", "link-mold", "link-ar", "link-lld", "link-wasm", "link-gnu", "link-msvc", "link-external", "scheme-https", "renderer-terminal", "renderer-ariadne", "renderer-sarif", "components"]
backend-c = ["dep:vun-component-backend-c"]
backend-native = ["dep:vun-component-backend-native"]
# The architectures the native backend compiles for; it lists none of those left out.
native-x86_64 = ["backend-native", "vun-component-backend-native/x86_64"]
native-arm64 = ["backend-native", "vun-component-backend-native/arm64"]
native-thumb = ["backend-native", "vun-component-backend-native/thumb"]
backend-wasm = ["dep:vun-component-backend-wasm"]
backend-cranelift = ["dep:vun-component-backend-cranelift"]
# The architectures the Cranelift backend compiles for; it lists none of those left out.
cranelift-x86_64 = ["backend-cranelift", "vun-component-backend-cranelift/x86_64"]
cranelift-arm64 = ["backend-cranelift", "vun-component-backend-cranelift/arm64"]
backend-qbe = ["dep:vun-backend-qbe"]
backend-llvm = ["dep:vun-backend-llvm"]
backend-external = ["dep:vun-backend-external"]
link-wild = ["dep:vun-component-link-wild"]
link-mold = ["dep:vun-component-link-mold"]
link-ar = ["dep:vun-component-link-ar"]
link-lld = ["dep:vun-component-link-lld"]
link-wasm = ["dep:vun-component-link-wasm"]
link-gnu = ["dep:vun-component-link-gnu"]
scheme-https = ["dep:vun-component-scheme-https"]
renderer-terminal = ["dep:vun-component-renderer-terminal"]
renderer-ariadne = ["dep:vun-component-renderer-ariadne"]
renderer-sarif = ["dep:vun-component-renderer-sarif"]
link-msvc = ["dep:vun-link-msvc"]
link-external = ["dep:vun-link-external"]
# Backends and linkers loaded from the toolchain's `components` directory (decision 498): where a
# platform loads libraries.
components = ["dep:vun-component", "dep:vun-backend-component", "dep:vun-link-component", "dep:vun-scheme-component"]

[dependencies]
vun-component = { workspace = true, optional = true }
vun-backend-component = { workspace = true, optional = true }
vun-link-component = { workspace = true, optional = true }
vun-scheme-component = { workspace = true, optional = true }
vun-server.workspace = true
vun-binder.workspace = true
vun-formatter.workspace = true
vun-documenter.workspace = true
vun-sema-asm.workspace = true
vun-sema-check.workspace = true
vun-sema-lint.workspace = true
vun-sema-plan.workspace = true
vun-sema-typeck.workspace = true
vun-sema-ty.workspace = true
vun-fetch.workspace = true
vun-uri.workspace = true
vun-data.workspace = true
vun-fs.workspace = true
vun-elf.workspace = true
vun-uf2.workspace = true
vun-par.workspace = true
vun-suggest.workspace = true
vun-hash.workspace = true
vun-command.workspace = true
vun-term.workspace = true
vun-trace.workspace = true
vun-span.workspace = true
vun-origin.workspace = true
vun-diag.workspace = true
vun-codec.workspace = true
vun-query.workspace = true
vun-reduce.workspace = true
vun-target.workspace = true
vun-sanitize.workspace = true
vun-tool.workspace = true
vun-syntax.workspace = true
vun-index.workspace = true
vun-variants.workspace = true
vun-grammar.workspace = true
vun-hir.workspace = true
vun-intern.workspace = true
vun-sema.workspace = true
vun-items.workspace = true
vun-mir.workspace = true
vun-mir-passes.workspace = true
vun-interp.workspace = true
vun-lir.workspace = true
vun-lower.workspace = true
vun-lir-passes.workspace = true
vun-backend.workspace = true
vun-link.workspace = true
vun-build.workspace = true
vun-renderer.workspace = true
vun-component-backend-c = { workspace = true, optional = true }
vun-component-backend-native = { workspace = true, optional = true }
vun-component-backend-wasm = { workspace = true, optional = true }
vun-component-backend-cranelift = { workspace = true, optional = true }
vun-backend-qbe = { workspace = true, optional = true }
vun-backend-llvm = { workspace = true, optional = true }
vun-backend-external = { workspace = true, optional = true }
vun-component-link-wild = { workspace = true, optional = true }
vun-component-link-mold = { workspace = true, optional = true }
vun-component-link-ar = { workspace = true, optional = true }
vun-component-link-lld = { workspace = true, optional = true }
vun-component-link-wasm = { workspace = true, optional = true }
vun-component-link-gnu = { workspace = true, optional = true }
vun-component-scheme-https = { workspace = true, optional = true }
vun-component-renderer-terminal = { workspace = true, optional = true }
vun-component-renderer-ariadne = { workspace = true, optional = true }
vun-component-renderer-sarif = { workspace = true, optional = true }
vun-link-msvc = { workspace = true, optional = true }
vun-link-external = { workspace = true, optional = true }

[dev-dependencies]
# The backends and linkers the tests build through, whatever the toolchain under test links in.
vun-backend-c.workspace = true
vun-backend-native.workspace = true
vun-backend-wasm.workspace = true
vun-backend-cranelift.workspace = true
vun-link-wild.workspace = true
vun-link-mold.workspace = true
vun-link-ar.workspace = true
vun-link-lld.workspace = true
vun-link-wasm.workspace = true
vun-link-gnu.workspace = true
vun-fmt.workspace = true
vun-doc.workspace = true
# The components the tests load as libraries.
vun-component-formatter-vun.workspace = true
vun-component-documenter-html.workspace = true
# The generated assemblers, whose numbering sema's tables must follow.
vun-isa-arm64.workspace = true
vun-isa-thumb.workspace = true
vun-isa-wasm32.workspace = true
vun-isa-x86_64.workspace = true
# What a block's instructions need of a processor.
vun-inline.workspace = true
vun-harness.workspace = true
vun-primitives.workspace = true
vun-bind.workspace = true
vun-hash.workspace = true
criterion.workspace = true
# An independent validator of the programs the wasm linker links.
wasmparser.workspace = true
# Reads back the libraries and programs linked for Windows.
vun-pe.workspace = true
vun-wasm.workspace = true

[[bench]]
name = "compile"
harness = false
