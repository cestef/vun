<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="380" height="200">
  <style>
    .v { stroke: #D46287; }
    .un { stroke: #24211D; }
    @media (prefers-color-scheme: dark) {
      .v { stroke: #DF7999; }
      .un { stroke: #F9F7F4; }
    }
    g { transform-box: fill-box; transform-origin: 50% 100%; }
    .stroke {
      stroke-dasharray: 1 2;
      stroke-dashoffset: 1;
      opacity: 0;
      animation: draw var(--d) cubic-bezier(0.7, 0, 0.25, 1) var(--at) forwards;
    }
    .word { animation: boing 0.9s linear 1.55s both; }
    .v-tilt { transform-origin: 50% 100%; animation: tilt 0.8s ease-out 1.6s both; }
    @keyframes draw {
      from { stroke-dashoffset: 1; opacity: 1; }
      to { stroke-dashoffset: 0; opacity: 1; }
    }
    @keyframes boing {
      0% { transform: scale(1, 1); }
      15% { transform: scale(1.1, 0.82); }
      35% { transform: scale(0.95, 1.08); }
      55% { transform: scale(1.03, 0.96); }
      75% { transform: scale(0.99, 1.01); }
      100% { transform: scale(1, 1); }
    }
    @keyframes tilt {
      0%, 100% { transform: rotate(0); }
      25% { transform: rotate(-9deg); }
      50% { transform: rotate(6deg); }
      75% { transform: rotate(-2deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .stroke, .word, .v-tilt { animation: none; stroke-dashoffset: 0; opacity: 1; }
    }
  </style>
  <g class="word" fill="none" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <g class="v-tilt"><path class="stroke v" pathLength="1" style="--at: 0s; --d: 0.45s" d="M40,40 L90,160 L140,40" /></g>
    <path class="stroke un" pathLength="1" style="--at: 0.4s; --d: 0.55s" d="M140,40 V110 A50,50 0 0 0 240,110 V40" />
    <path class="stroke un" pathLength="1" style="--at: 0.9s; --d: 0.25s" d="M240,40 V160" />
    <path class="stroke un" pathLength="1" style="--at: 1.1s; --d: 0.45s" d="M240,90 A50,50 0 0 1 340,90 V160" />
  </g>
</svg>
