<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="380" height="200">
  <style>
    .v { stroke: #D46287; }
    .un { stroke: #24211D; }
    @media (prefers-color-scheme: dark) {
      .v { stroke: #DF7999; }
      .un { stroke: #F9F7F4; }
    }
    g { transform-box: fill-box; transform-origin: 50% 100%; }
    .letter { animation: shock 1.6s linear calc(var(--i) * 0.06s) both; }
    .letter:first-child { transform-origin: 50% 50%; animation-name: roll; animation-delay: 0s; }
    @keyframes roll {
      0% { transform: translateX(-260px) rotate(-360deg); animation-timing-function: cubic-bezier(0.25, 0.6, 0.4, 1); }
      52% { transform: translateX(8px) rotate(14deg); animation-timing-function: ease-in-out; }
      68% { transform: translateX(-3px) rotate(-6deg); }
      84% { transform: translateX(0) rotate(2deg); }
      100% { transform: translateX(0) rotate(0); }
    }
    @keyframes shock {
      0%, 50%, 100% { transform: translateX(0) scale(1, 1); }
      56% { transform: translateX(6px) scale(1.05, 0.92); }
      66% { transform: translateX(-2px) scale(0.98, 1.03); }
      78% { transform: translateX(0) scale(1, 1); }
    }
    @media (prefers-reduced-motion: reduce) { .letter { animation: none; } }
  </style>
  <g fill="none" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <g class="letter" style="--i: 0"><path class="v" d="M40,40 L90,160 L140,40" /></g>
    <g class="letter" style="--i: 1"><path class="un" d="M140,40 V110 A50,50 0 0 0 240,110 V40" /></g>
    <g class="letter" style="--i: 2"><path class="un" d="M240,40 V160 M240,90 A50,50 0 0 1 340,90 V160" /></g>
  </g>
</svg>
