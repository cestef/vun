<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="380" height="200">
  <style>
    .v { stroke: #D46287; }
    .un { stroke: #24211D; }
    @media (prefers-color-scheme: dark) {
      .v { stroke: #DF7999; }
      .un { stroke: #F9F7F4; }
    }
    g { transform-box: fill-box; transform-origin: 50% 100%; }
    .word { transform-box: fill-box; transform-origin: 50% 100%; animation: jelly 3s ease-in-out infinite; }
    @keyframes jelly {
      0%, 55%, 100% { transform: skewX(0) scale(1, 1); }
      5% { transform: skewX(-14deg) scale(1.04, 0.94); }
      12% { transform: skewX(10deg) scale(0.97, 1.04); }
      19% { transform: skewX(-7deg) scale(1.02, 0.98); }
      26% { transform: skewX(4deg) scale(0.99, 1.01); }
      33% { transform: skewX(-2deg); }
      40% { transform: skewX(1deg); }
    }
    @media (prefers-reduced-motion: reduce) { .word { animation: none; } }
  </style>
  <g class="word">
  <g fill="none" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <g class="letter" style="--i: 0"><path class="v" d="M40,40 L90,160 L140,40" /></g>
    <g class="letter" style="--i: 1"><path class="un" d="M140,40 V110 A50,50 0 0 0 240,110 V40" /></g>
    <g class="letter" style="--i: 2"><path class="un" d="M240,40 V160 M240,90 A50,50 0 0 1 340,90 V160" /></g>
  </g>
  </g>
</svg>
