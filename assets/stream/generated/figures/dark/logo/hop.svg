<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="380" height="200">
  <style>
    .v { stroke: #D46287; }
    .un { stroke: #24211D; }
    @media (prefers-color-scheme: dark) {
      .v { stroke: #DF7999; }
      .un { stroke: #F9F7F4; }
    }
    g { transform-box: fill-box; transform-origin: 50% 100%; }
    .letter { animation: hop 2.6s linear calc(var(--i) * 0.14s) infinite; }
    @keyframes hop {
      0% { transform: translateY(0) scale(1, 1); animation-timing-function: ease-out; }
      8% { transform: translateY(0) scale(1.12, 0.86); animation-timing-function: cubic-bezier(0.2, 0.8, 0.4, 1); }
      22% { transform: translateY(-38px) scale(0.92, 1.1); animation-timing-function: cubic-bezier(0.6, 0, 0.8, 0.4); }
      34% { transform: translateY(0) scale(1.14, 0.84); animation-timing-function: ease-out; }
      42% { transform: translateY(-4px) scale(0.97, 1.03); animation-timing-function: ease-in-out; }
      50%, 100% { transform: translateY(0) scale(1, 1); }
    }
    @media (prefers-reduced-motion: reduce) { .letter { animation: none; } }
  </style>
  <g fill="none" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <g class="letter" style="--i: 0"><path class="v" d="M40,40 L90,160 L140,40" /></g>
    <g class="letter" style="--i: 1"><path class="un" d="M140,40 V110 A50,50 0 0 0 240,110 V40" /></g>
    <g class="letter" style="--i: 2"><path class="un" d="M240,40 V160 M240,90 A50,50 0 0 1 340,90 V160" /></g>
  </g>
<style>.v { stroke: #DF7999; } .un { stroke: #F9F7F4; }</style>
</svg>
