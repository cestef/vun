<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 50 192 140" width="192" height="140">
  <style>
    .body { fill: #DF7999; stroke: #DF7999; }
    .face { fill: #24211D; stroke: #24211D; }
    .mascot { animation: shake 2.2s infinite; }
    @keyframes shake {
      0%, 60%, 100% { transform: translate(0, 0); }
      64%, 72%, 80% { transform: translate(-4px, 0); }
      68%, 76%, 84% { transform: translate(4px, 0); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .mood:first-child { opacity: 1; }
    }
  </style>
  <g class="mascot" stroke-linecap="round" stroke-linejoin="round">
    <path class="body" d="M50,80 H150 V160 H50 V80 Z" stroke-width="60" />
    <g class="face" stroke-width="10"><g transform="translate(60,90)"><path class="eye" d="M-9,-4 Q0,0 9,4" fill="none" /></g><g transform="translate(140,90)"><path class="eye" d="M9,-4 Q0,0 -9,4" fill="none" /></g><path d="M-9,0 Q0,0 9,0 Q0,0 -9,0 Z" transform="translate(100,110)" /></g>
  </g>
</svg>
