<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="380" height="200">
  <style>
    .v { stroke: #D46287; }
    .un { stroke: #24211D; }
    @media (prefers-color-scheme: dark) {
      .v { stroke: #DF7999; }
      .un { stroke: #F9F7F4; }
    }
    .stroke {
      stroke-dasharray: 1 2;
      animation: trace 4.2s cubic-bezier(0.7, 0, 0.25, 1) var(--at) infinite both;
    }
    @keyframes trace {
      0% { stroke-dashoffset: 1; opacity: 0; }
      1% { stroke-dashoffset: 1; opacity: 1; }
      16%, 58% { stroke-dashoffset: 0; opacity: 1; }
      74% { stroke-dashoffset: -1; opacity: 1; }
      75%, 100% { stroke-dashoffset: -1; opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .stroke { animation: none; stroke-dashoffset: 0; opacity: 1; }
    }
  </style>
  <g fill="none" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <path class="stroke v" pathLength="1" style="--at: 0s" d="M40,40 L90,160 L140,40" />
    <path class="stroke un" pathLength="1" style="--at: 0.3s" d="M140,40 V110 A50,50 0 0 0 240,110 V40" />
    <path class="stroke un" pathLength="1" style="--at: 0.6s" d="M240,40 V160" />
    <path class="stroke un" pathLength="1" style="--at: 0.75s" d="M240,90 A50,50 0 0 1 340,90 V160" />
  </g>
<style>.v { stroke: #F9F7F4; } .un { stroke: #24211D; }</style>
</svg>
