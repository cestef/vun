<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="380" height="200">
  <style>
    .v { stroke: #D46287; }
    .un { stroke: #24211D; }
    @media (prefers-color-scheme: dark) {
      .v { stroke: #DF7999; }
      .un { stroke: #F9F7F4; }
    }
    g { transform-box: fill-box; transform-origin: 50% 100%; }
    .letter { animation: pop 0.75s linear calc(var(--i) * 0.13s) both; }
    @keyframes pop {
      0% { transform: scale(0, 0) rotate(-24deg); opacity: 0; animation-timing-function: cubic-bezier(0.2, 0.8, 0.4, 1); }
      45% { transform: scale(1.2, 1.2) rotate(7deg); opacity: 1; animation-timing-function: ease-in-out; }
      65% { transform: scale(0.9, 0.94) rotate(-3deg); }
      82% { transform: scale(1.04, 1.02) rotate(1deg); }
      100% { transform: scale(1, 1) rotate(0); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) { .letter { animation: none; } }
  </style>
  <g fill="none" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <g class="letter" style="--i: 0"><path class="v" d="M40,40 L90,160 L140,40" /></g>
    <g class="letter" style="--i: 1"><path class="un" d="M140,40 V110 A50,50 0 0 0 240,110 V40" /></g>
    <g class="letter" style="--i: 2"><path class="un" d="M240,40 V160 M240,90 A50,50 0 0 1 340,90 V160" /></g>
  </g>
<style>.v { stroke: #F9F7F4; } .un { stroke: #24211D; }</style>
</svg>
