<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <style>
    .tile { fill: #F0ECE6; }
    .v { stroke: #D46287; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #24211D; }
      .v { stroke: #DF7999; }
    }
    .peek { transform-box: fill-box; transform-origin: 50% 100%; animation: peek 4s linear infinite; }
    @keyframes peek {
      0%, 100% { transform: translateY(150px) scale(1, 1) rotate(0); }
      8% { transform: translateY(150px) scale(1, 1); animation-timing-function: cubic-bezier(0.3, 1.5, 0.5, 1); }
      18% { transform: translateY(0) scale(0.94, 1.08) rotate(0); }
      24% { transform: translateY(0) scale(1.06, 0.94); }
      30% { transform: translateY(0) scale(1, 1) rotate(0); animation-timing-function: cubic-bezier(0.3, 1.4, 0.5, 1); }
      38%, 46% { transform: translateY(0) rotate(-14deg); animation-timing-function: cubic-bezier(0.3, 1.4, 0.5, 1); }
      54%, 62% { transform: translateY(0) rotate(12deg); animation-timing-function: cubic-bezier(0.3, 1.4, 0.5, 1); }
      70% { transform: translateY(0) scale(1, 1) rotate(0); }
      76% { transform: translateY(-10px) scale(0.96, 1.05); animation-timing-function: cubic-bezier(0.6, 0, 0.9, 0.5); }
      88% { transform: translateY(150px) scale(1, 1) rotate(0); }
    }
    @media (prefers-reduced-motion: reduce) { .peek { animation: none; } }
  </style>
  <clipPath id="tile"><rect width="200" height="200" rx="48" /></clipPath>
  <rect class="tile" width="200" height="200" rx="48" />
  <g clip-path="url(#tile)">
    <g class="peek">
      <path class="v" d="M40,40 L90,160 L140,40" transform="translate(100 104) scale(0.62) translate(-90 -100)" fill="none" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
<style>.v { stroke: #D46287; } .un { stroke: #24211D; }</style>
</svg>
