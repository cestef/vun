<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="380" height="200">
  <style>
    .v { stroke: #D46287; }
    .un { stroke: #24211D; }
    @media (prefers-color-scheme: dark) {
      .v { stroke: #DF7999; }
      .un { stroke: #F9F7F4; }
    }
    g { transform-box: fill-box; transform-origin: 50% 100%; }
    .letter { animation: shock 3s linear calc(var(--i) * 0.05s) infinite; }
    .letter:first-child { animation-name: flip; animation-delay: 0s; }
    @keyframes flip {
      0%, 60%, 100% { transform: translateY(0) scale(1, 1); }
      6% { transform: translateY(0) scale(1.14, 0.84); animation-timing-function: cubic-bezier(0.2, 0.8, 0.4, 1); }
      14% { transform: translateY(-56px) scale(0, 1.08); animation-timing-function: linear; }
      20% { transform: translateY(-72px) scale(-1, 1.04); animation-timing-function: linear; }
      26% { transform: translateY(-56px) scale(0, 1.04); animation-timing-function: cubic-bezier(0.6, 0, 0.8, 0.4); }
      34% { transform: translateY(0) scale(1.16, 0.82); animation-timing-function: ease-out; }
      42% { transform: translateY(-5px) scale(0.97, 1.03); }
      50% { transform: translateY(0) scale(1, 1); }
    }
    @keyframes shock {
      0%, 34%, 100% { transform: scale(1, 1); }
      37% { transform: scale(1.06, 0.9); }
      43% { transform: scale(0.98, 1.03); }
      49% { transform: scale(1, 1); }
    }
    @media (prefers-reduced-motion: reduce) { .letter { animation: none; } }
  </style>
  <g fill="none" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <g class="letter" style="--i: 0"><path class="v" d="M40,40 L90,160 L140,40" /></g>
    <g class="letter" style="--i: 1"><path class="un" d="M140,40 V110 A50,50 0 0 0 240,110 V40" /></g>
    <g class="letter" style="--i: 2"><path class="un" d="M240,40 V160 M240,90 A50,50 0 0 1 340,90 V160" /></g>
  </g>
<style>.v { stroke: #24211D; } .un { stroke: #24211D; }</style>
</svg>
