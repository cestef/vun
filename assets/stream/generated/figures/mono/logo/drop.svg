<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="380" height="200">
  <style>
    .v { stroke: #D46287; }
    .un { stroke: #24211D; }
    @media (prefers-color-scheme: dark) {
      .v { stroke: #DF7999; }
      .un { stroke: #F9F7F4; }
    }
    g { transform-box: fill-box; transform-origin: 50% 100%; }
    .letter { animation: drop 1.1s linear calc(var(--i) * 0.16s) both; }
    @keyframes drop {
      0% { transform: translateY(-230px) scale(0.9, 1.15); animation-timing-function: cubic-bezier(0.5, 0, 1, 0.6); }
      42% { transform: translateY(0) scale(1.18, 0.78); animation-timing-function: cubic-bezier(0, 0.5, 0.5, 1); }
      60% { transform: translateY(-46px) scale(0.94, 1.07); animation-timing-function: cubic-bezier(0.5, 0, 1, 0.5); }
      74% { transform: translateY(0) scale(1.08, 0.9); animation-timing-function: cubic-bezier(0, 0.5, 0.5, 1); }
      84% { transform: translateY(-12px) scale(0.98, 1.02); animation-timing-function: cubic-bezier(0.5, 0, 1, 0.5); }
      92% { transform: translateY(0) scale(1.03, 0.97); }
      100% { transform: translateY(0) scale(1, 1); }
    }
    @media (prefers-reduced-motion: reduce) { .letter { animation: none; } }
  </style>
  <g fill="none" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <g class="letter" style="--i: 0"><path class="v" d="M40,40 L90,160 L140,40" /></g>
    <g class="letter" style="--i: 1"><path class="un" d="M140,40 V110 A50,50 0 0 0 240,110 V40" /></g>
    <g class="letter" style="--i: 2"><path class="un" d="M240,40 V160 M240,90 A50,50 0 0 1 340,90 V160" /></g>
  </g>
<style>.v { stroke: #24211D; } .un { stroke: #24211D; }</style>
</svg>
