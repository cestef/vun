<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 50 192 140" width="192" height="140">
  <style>
    .body { fill: #24211D; stroke: #24211D; }
    .face { fill: #F9F7F4; stroke: #F9F7F4; }
    .mood { opacity: 0; animation: turn 14s step-end infinite; }
    .mood:nth-child(1) { animation-delay: -14s; }
    .mood:nth-child(2) { animation-delay: -12s; }
    .mood:nth-child(3) { animation-delay: -10s; }
    .mood:nth-child(4) { animation-delay: -8s; }
    .mood:nth-child(5) { animation-delay: -6s; }
    .mood:nth-child(6) { animation-delay: -4s; }
    .mood:nth-child(7) { animation-delay: -2s; }
    .eye { transform-box: fill-box; transform-origin: center; animation: change 2s infinite; }
    @keyframes turn {
      0% { opacity: 1; }
      14.286% { opacity: 0; }
    }
    @keyframes change {
      0%, 100% { transform: scaleY(0.1); }
      8%, 94% { transform: scaleY(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .mood:first-child { opacity: 1; }
    }
  </style>
  <g class="mascot" stroke-linecap="round" stroke-linejoin="round">
    <path class="body" d="M50,80 H150 V160 H50 V80 Z" stroke-width="60" />
    <g class="face" stroke-width="10"><g class="mood"><g transform="translate(60,90)"><path class="eye" d="M0,-7 Q0,0 0,7" fill="none" /></g><g transform="translate(140,90)"><path class="eye" d="M0,-7 Q0,0 0,7" fill="none" /></g><path d="M-13,0 Q0,12 13,0 Q0,12 -13,0 Z" transform="translate(100,110)" /></g><g class="mood"><g transform="translate(60,90)"><path class="eye" d="M-10,4 Q0,-12 10,4" fill="none" /></g><g transform="translate(140,90)"><path class="eye" d="M10,4 Q0,-12 -10,4" fill="none" /></g><path d="M-14,0 Q0,0 14,0 Q0,36 -14,0 Z" transform="translate(100,110)" /></g><g class="mood"><g transform="translate(62,90)"><path class="eye" d="M0,-7 Q0,0 0,7" fill="none" /></g><g transform="translate(142,90)"><path class="eye" d="M10,4 Q0,-12 -10,4" fill="none" /></g><path d="M-14,0 Q0,0 14,0 Q0,36 -14,0 Z" transform="translate(102,110)" /></g><g class="mood"><g transform="translate(60,86)"><path class="eye" d="M0,-10 Q0,0 0,10" fill="none" /></g><g transform="translate(140,86)"><path class="eye" d="M0,-10 Q0,0 0,10" fill="none" /></g><path d="M-4,0 Q0,-14 4,0 Q0,14 -4,0 Z" transform="translate(100,106)" /></g><g class="mood"><g transform="translate(60,96)"><path class="eye" d="M0,-7 Q0,0 0,7" fill="none" /></g><g transform="translate(140,96)"><path class="eye" d="M0,-7 Q0,0 0,7" fill="none" /></g><path d="M-11,0 Q0,-10 11,0 Q0,-10 -11,0 Z" transform="translate(100,116)" /></g><g class="mood"><g transform="translate(60,90)"><path class="eye" d="M-9,-4 Q0,0 9,4" fill="none" /></g><g transform="translate(140,90)"><path class="eye" d="M9,-4 Q0,0 -9,4" fill="none" /></g><path d="M-9,0 Q0,0 9,0 Q0,0 -9,0 Z" transform="translate(100,110)" /></g><g class="mood"><g transform="translate(60,94)"><path class="eye" d="M-10,0 Q0,8 10,0" fill="none" /></g><g transform="translate(140,94)"><path class="eye" d="M10,0 Q0,8 -10,0" fill="none" /></g><path d="M-4,0 Q0,0 4,0 Q0,6 -4,0 Z" transform="translate(100,114)" /></g></g>
  </g>
</svg>
