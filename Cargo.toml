[workspace]
resolver = "3"
members = ["compiler/*/*", "fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "LicenseRef-DBAD OR LicenseRef-QUACK"
repository = "https://github.com/cestef/vun"

