vun-data = { path = "compiler/base/data" }
vun-uri = { path = "compiler/base/uri" }
vun-tree-sitter = { path = "compiler/base/tree-sitter" }
vun-variants = { path = "compiler/base/variants" }
vun-items = { path = "compiler/lang/items" }
vun-hash = { path = "compiler/base/hash" }
vun-html = { path = "compiler/base/html" }
vun-graph = { path = "compiler/base/graph" }
vun-bytes = { path = "compiler/base/bytes" }
vun-fs = { path = "compiler/base/fs" }
vun-outline = { path = "compiler/base/outline" }
vun-span = { path = "compiler/base/span" }
vun-inline = { path = "compiler/isa/inline" }
vun-isa = { path = "compiler/isa/api" }
vun-isa-arm64 = { path = "compiler/isa/arm64" }
vun-isa-thumb = { path = "compiler/isa/thumb" }
vun-isa-x86_64 = { path = "compiler/isa/x86_64" }
