vun-bind = { path = "compiler/tools/bind" }
vun-clang = { path = "compiler/tools/clang" }
vun-command = { path = "compiler/tools/command" }
vun-harness = { path = "compiler/base/harness" }
vun-driver = { path = "compiler/tools/driver" }
vun-lsp = { path = "compiler/tools/lsp" }
vun-cli = { path = "compiler/tools/cli" }
vun-xtask = { path = "compiler/tools/xtask" }
vun-generate = { path = "compiler/tools/generate" }

# external
arc-swap = "1"
boxcar = "0.2"
foldhash = "0.2"
papaya = "0.2"
mimalloc = { version = "0.1", default-features = false }
etcetera = "0.10"
tracing = { version = "0.1", default-features = false, features = ["std"] }
proc-macro2 = { version = "1", default-features = false }
quote = { version = "1", default-features = false }
syn = { version = "2", default-features = false, features = ["full", "parsing", "printing"] }
prettyplease = "0.2"
annotate-snippets = "0.12"
anstyle = "1"
ariadne = "0.6"
blake3 = { version = "1", default-features = false, features = ["std", "pure"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Ed25519, already built for `ureq`'s TLS: the signatures of releases.
ring = { version = "0.17", default-features = false }
flate2 = "1"
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
lzma-rs = "0.3"
stacker = "0.1.25"
num-bigint = "0.5"
libfuzzer-sys = "0.4"
# Doc comments are Markdown, rendered into the pages `vun doc` writes.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# Tests only: an independent decoder checking the x86-64 assembler's table.
yaxpeax-x86 = { version = "2", default-features = false, features = ["std", "fmt"] }
# Tests only: an independent AArch64 decoder checking the arm64 assembler's table, and its traits.
yaxpeax-arm = { version = "0.5", default-features = false, features = ["std", "fmt"] }
yaxpeax-arch = { version = "0.3", default-features = false }
# Tests only: an independent parser validating the modules of the wasm backend.
wasmparser = { version = "0.259", default-features = false, features = ["std", "validate", "features"] }
# Benchmarks only: statistics over repeated runs, baselines saved and compared (`cargo bench`).
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# libclang loaded at run time, never linked (decision 131); `clang_9_0` is the oldest accepted.
clang-sys = { version = "1.8", default-features = false, features = ["runtime", "clang_9_0"] }

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.dev]
debug = 1
# The compiler's tests build and run programs through it: optimized a little, the suite runs in a
# third of the time for a few seconds more per rebuild.
opt-level = 1

[profile.release]
lto = "thin"

# What is distributed: slower to build, smaller and faster to run; `cargo xtask size` measures it.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
