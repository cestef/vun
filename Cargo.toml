[workspace]
resolver = "3"
members = ["compiler/*/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
vun-index = { path = "compiler/base/index" }
vun-suggest = { path = "compiler/base/suggest" }
vun-par = { path = "compiler/base/par" }
vun-codec = { path = "compiler/base/codec" }
vun-json = { path = "compiler/base/json" }
vun-items = { path = "compiler/base/items" }
vun-hash = { path = "compiler/base/hash" }
vun-graph = { path = "compiler/base/graph" }
vun-fs = { path = "compiler/base/fs" }
vun-outline = { path = "compiler/base/outline" }
vun-span = { path = "compiler/base/span" }
vun-intern = { path = "compiler/base/intern" }
vun-origin = { path = "compiler/base/origin" }
vun-diag = { path = "compiler/base/diag" }
vun-query = { path = "compiler/base/query" }
vun-pass = { path = "compiler/base/pass" }
vun-tool = { path = "compiler/base/tool" }
vun-trace = { path = "compiler/base/trace" }
vun-target = { path = "compiler/base/target" }
vun-grammar = { path = "compiler/front/grammar" }
vun-desugar = { path = "compiler/front/desugar" }
vun-syntax = { path = "compiler/front/syntax" }
vun-hir = { path = "compiler/front/hir" }
vun-sema = { path = "compiler/front/sema" }
vun-mir = { path = "compiler/mid/mir" }
vun-mir-passes = { path = "compiler/mid/passes" }
vun-interp = { path = "compiler/mid/interp" }
vun-lir = { path = "compiler/low/lir" }
vun-lower = { path = "compiler/low/lower" }
vun-abi = { path = "compiler/low/abi" }
vun-lir-passes = { path = "compiler/low/passes" }
vun-backend = { path = "compiler/back/api" }
vun-backend-c = { path = "compiler/back/c" }
vun-backend-baseline = { path = "compiler/back/baseline" }
vun-backend-cranelift = { path = "compiler/back/cranelift" }
vun-backend-qbe = { path = "compiler/back/qbe" }
vun-backend-llvm = { path = "compiler/back/llvm" }
vun-backend-process = { path = "compiler/back/process" }
vun-link = { path = "compiler/link/api" }
vun-link-wild = { path = "compiler/link/wild" }
vun-link-mold = { path = "compiler/link/mold" }
vun-link-lld = { path = "compiler/link/lld" }
vun-link-gnu = { path = "compiler/link/gnu" }
vun-link-msvc = { path = "compiler/link/msvc" }
vun-link-process = { path = "compiler/link/process" }
vun-render-short = { path = "compiler/render/short" }
vun-render-annotate = { path = "compiler/render/annotate" }
vun-render-ariadne = { path = "compiler/render/ariadne" }
vun-render-json = { path = "compiler/render/json" }
vun-render-sarif = { path = "compiler/render/sarif" }
vun-build = { path = "compiler/tools/build" }
vun-pkg = { path = "compiler/tools/pkg" }
vun-http = { path = "compiler/tools/http" }
vun-fmt = { path = "compiler/tools/fmt" }
vun-bind = { path = "compiler/tools/bind" }
vun-clang = { path = "compiler/tools/clang" }
vun-probe = { path = "compiler/tools/probe" }
vun-command = { path = "compiler/tools/command" }
vun-harness = { path = "compiler/tools/harness" }
vun-driver = { path = "compiler/tools/driver" }
vun-lsp = { path = "compiler/tools/lsp" }
vun-cli = { path = "compiler/tools/cli" }
vun-xtask = { path = "compiler/tools/xtask" }
vun-generate = { path = "compiler/tools/generate" }

# external
boxcar = "0.2"
foldhash = "0.2"
papaya = "0.2"
etcetera = "0.10"
tracing = { version = "0.1", default-features = false, features = ["std"] }
proc-macro2 = { version = "1", default-features = false }
quote = { version = "1", default-features = false }
syn = { version = "2", default-features = false, features = ["full", "parsing", "printing"] }
prettyplease = "0.2"
annotate-snippets = "0.12"
ariadne = "0.6"
blake3 = { version = "1", default-features = false, features = ["std", "pure"] }
bitreq = { version = "0.3", features = ["https"] }
flate2 = "1"
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
lzma-rs = "0.3"
num-bigint = "0.5"
# libclang loaded at run time, never linked (decision 131); `clang_9_0` is the oldest accepted.
clang-sys = { version = "1.8", default-features = false, features = ["runtime", "clang_9_0"] }

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 16

# What is distributed: slower to build, smaller and faster to run; `cargo xtask size` measures it.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
